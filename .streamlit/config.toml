[theme]
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.8rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
metricValueFontWeight = 700

[theme.light]
primaryColor = "#4f46e5"
backgroundColor = "#f7f7fc"
secondaryBackgroundColor = "#eceefb"
textColor = "#1c1a3a"
borderColor = "#d9dcf2"
linkColor = "#4338ca"
chartCategoricalColors = ["#4f46e5", "#0ea5e9", "#f59e0b", "#10b981", "#ec4899", "#8b5cf6", "#64748b"]
dataframeHeaderBackgroundColor = "#e3e6fa"

[theme.dark]
primaryColor = "#6366f1"
backgroundColor = "#0b0f1f"
secondaryBackgroundColor = "#151a33"
textColor = "#e7e9f7"
borderColor = "#272f57"
linkColor = "#a5b4fc"
chartCategoricalColors = ["#818cf8", "#38bdf8", "#fbbf24", "#34d399", "#f472b6", "#a78bfa", "#94a3b8"]
dataframeHeaderBackgroundColor = "#1d2445"

[server]
runOnSave = false
